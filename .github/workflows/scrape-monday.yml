name: Scrape lunes

on:
  schedule:
    # Lunes 11:00 en Argentina (UTC-3) = 14:00 UTC
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-lunes
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Instalar dependencias y Chrome
        run: |
          npm ci
          sudo npx puppeteer browsers install chrome --install-deps

      - name: Correr el scraper
        run: npm run scrape

      - name: Guardar copia de la corrida
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/snapshots/text
            data/snapshots/metadata.json
            data/history/url-history.jsonl
            data/status/latest.json
            reports
            site

      - name: Publicar baseline y reporte
        run: |
          git config user.name "rfp-monitor"
          git config user.email "rfp-monitor@users.noreply.github.com"
          paths=()
          [ -d data/snapshots/text ] && paths+=(data/snapshots/text)
          [ -f data/snapshots/metadata.json ] && paths+=(data/snapshots/metadata.json)
          [ -f data/history/url-history.jsonl ] && paths+=(data/history/url-history.jsonl)
          [ -f data/status/latest.json ] && paths+=(data/status/latest.json)
          [ -d reports ] && paths+=(reports)
          [ -f site/index.html ] && paths+=(site)
          if [ ${#paths[@]} -eq 0 ]; then
            echo "Nada para publicar"
            exit 0
          fi
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear"
            exit 0
          fi
          git commit -m "scrape: resultados del $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main se movió mientras corría el scrape. Reintento $i."
          done
          echo "No se pudo subir. La copia queda en el artifact de este job."
          exit 1

      - name: Actualizar spreadsheet
        env:
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_WEBHOOK_TOKEN: ${{ secrets.SHEETS_WEBHOOK_TOKEN }}
        run: node scripts/pushSheet.js
