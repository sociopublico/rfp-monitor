version: "3.8"

services:
  rfp-monitor:
    container_name: rfp-monitor
    image: registry.sociopublico.com/rfp-monitor
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    shm_size: '2gb'  # Memoria compartida para Chrome/Chromium
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rfp-monitor.rule=Host(`rfp.sociopublico.com`)"
      - "traefik.http.routers.rfp-monitor.entrypoints=websecure"
      - "traefik.http.routers.rfp-monitor.tls=true"
      - "traefik.http.routers.rfp-monitor.tls.certresolver=letsencrypt"
      - "traefik.http.services.rfp-monitor.loadbalancer.server.port=3000"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
