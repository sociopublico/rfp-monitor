services:
  rfp-monitor:
    container_name: rfp-monitor
    image: registry.sociopublico.com/rfp-monitor
    build: .
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      # Persistencia de snapshots, histórico, diffs y alertas (único mount de host)
      - ./data:/app/data
    shm_size: "2gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Sin `ports:`: Traefik enruta por la red interna. No exponer 3000 al host.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rfp-monitor.rule=Host(`rfp.sociopublico.com`)"
      - "traefik.http.routers.rfp-monitor.entrypoints=websecure"
      - "traefik.http.routers.rfp-monitor.tls=true"
      - "traefik.http.routers.rfp-monitor.tls.certresolver=letsencrypt"
      - "traefik.http.services.rfp-monitor.loadbalancer.server.port=3000"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
